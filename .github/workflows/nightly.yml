name: Nightly Magrathea SDK

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-magrathea-sdk
  cancel-in-progress: true

jobs:
  linux-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAGRATHEA_GEMINI_API_KEY: ${{ secrets.MAGRATHEA_GEMINI_API_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install pinned browser matrix
        working-directory: tooling/web-browser-e2e
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium firefox webkit

      - name: Run deterministic Linux, distribution, and sample gates
        run: ./gradlew verifySdkLinux verifySdkWeb --no-daemon --stacktrace

      - name: Report resolved Runtime dependencies
        run: ./gradlew :magrathea-runtime:dependencies --configuration jvmRuntimeClasspath --no-daemon

      - name: Install checksum-pinned OSV-Scanner
        run: |
          curl --fail --show-error --location --output /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  /tmp/osv-scanner" | sha256sum --check
          chmod 0755 /tmp/osv-scanner

      - name: Scan the production SBOM against current OSV advisories
        run: |
          mkdir -p build/reports/osv
          set +e
          /tmp/osv-scanner scan source \
            --lockfile build/reports/supply-chain/magrathea-sbom.cdx.json \
            --format json \
            --output-file build/reports/osv/osv-results.json
          scan_status=$?
          set -e

          if [ ! -s build/reports/osv/osv-results.json ]; then
            echo "::error title=OSV advisory scan::Scanner produced no JSON report."
            exit 1
          fi

          finding_count=$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' build/reports/osv/osv-results.json)
          {
            echo "## OSV advisory scan"
            echo
            if [ "$finding_count" -eq 0 ]; then
              echo "No known vulnerabilities found in the production SBOM."
            else
              echo "Found $finding_count known vulnerabilities:"
              echo
              echo "| Severity | Package | Advisory | Summary |"
              echo "| --- | --- | --- | --- |"
              jq -r '
                .results[]?.packages[]? |
                .package as $package |
                .vulnerabilities[]? |
                "| \(.database_specific.severity // "UNKNOWN") | `\($package.name)@\($package.version)` | [\(.id)](https://osv.dev/vulnerability/\(.id)) | \((.summary // "") | gsub("[|\\r\\n]"; " ")) |"
              ' build/reports/osv/osv-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$finding_count" -gt 0 ]; then
            echo "::error title=OSV advisory scan::$finding_count known vulnerabilities found in the production SBOM; see the job summary."
            jq -r '
              .results[]?.packages[]? |
              .package as $package |
              .vulnerabilities[]? |
              "OSV_FINDING severity=\(.database_specific.severity // "UNKNOWN") package=\($package.name)@\($package.version) advisory=\(.id) summary=\((.summary // "") | gsub("[\\r\\n]"; " "))"
            ' build/reports/osv/osv-results.json
          elif [ "$scan_status" -ne 0 ]; then
            echo "::error title=OSV advisory scan::Scanner failed with exit status $scan_status."
            echo "OSV_SCAN_ERROR status=$scan_status"
          else
            echo "OSV_SCAN_OK findings=0"
          fi

          if [ "$finding_count" -gt 0 ]; then
            exit 1
          fi
          exit "$scan_status"

      - name: Retain dated vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magrathea-osv-${{ github.run_id }}
          if-no-files-found: error
          path: build/reports/osv/osv-results.json
          retention-days: 30

      - name: Run controlled Gemini live smoke
        if: env.MAGRATHEA_GEMINI_API_KEY != ''
        run: ./gradlew :provider-live-harness:run --no-daemon --args="provider=gemini scenario=chat streaming=true model=gemini-2.5-flash"

      - name: Record unavailable live evidence explicitly
        if: env.MAGRATHEA_GEMINI_API_KEY == ''
        run: echo "MAGRATHEA_LIVE_NOT_RUN provider=gemini reason=missing-secret"

  apple-nightly:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: published-consumer
            gradle_task: verifyKmpPublishedConsumerApple
            boot_simulator: false
          - name: simulator-tests
            gradle_task: verifyKmpAppleTests
            boot_simulator: true
    name: apple-nightly (${{ matrix.name }})
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Boot an available iOS Simulator
        if: matrix.boot_simulator
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read).fetch("devices").values.flatten; device = devices.find { |item| item["name"].start_with?("iPhone") }; abort("No available iPhone simulator") unless device; puts device.fetch("udid")')
          SIMULATOR_STATE=$(xcrun simctl list devices available -j | ruby -rjson -e 'udid = ARGV.fetch(0); devices = JSON.parse(STDIN.read).fetch("devices").values.flatten; puts devices.find { |item| item["udid"] == udid }.fetch("state")' "$SIMULATOR_UDID")
          if [ "$SIMULATOR_STATE" != "Booted" ]; then
            xcrun simctl boot "$SIMULATOR_UDID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run ${{ matrix.name }} Apple gate
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon --stacktrace
