name: Publish Magrathea Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: magrathea-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      publish_mode: ${{ steps.remote.outputs.mode }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate the immutable release tag
        id: release
        run: |
          RELEASE_VERSION="$(scripts/verify-release-tag "$GITHUB_REF_NAME")"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find the immutable candidate for this commit
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          CANDIDATE_RUN_ID="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
              -f "head_sha=$RELEASE_COMMIT" \
              -f event=workflow_dispatch \
              -f status=success \
              -f per_page=100 \
              --jq \
              "[.workflow_runs[] |
                select(.head_sha == \"$RELEASE_COMMIT\" and .conclusion == \"success\")] |
               sort_by([.run_number, .run_attempt]) |
               first |
               .id // empty"
          )"
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "No successful release candidate exists for $RELEASE_COMMIT." >&2
            exit 1
          fi
          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the exact release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: magrathea-release-candidate
          path: candidate-download
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify candidate provenance and contents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/candidate-download/Magrathea-$RELEASE_VERSION-release-candidate.zip"
          CHECKSUM="$CANDIDATE.sha256"
          gh attestation verify "$CANDIDATE" --repo "$GITHUB_REPOSITORY"
          scripts/verify-release-candidate \
            "$GITHUB_WORKSPACE" \
            "$CANDIDATE" \
            "$CHECKSUM" \
            "$RELEASE_COMMIT" \
            "$RELEASE_VERSION" \
            "$CANDIDATE_RUN_ID" \
            "$RUNNER_TEMP/verified-candidate"
          gh attestation verify \
            "$RUNNER_TEMP/verified-candidate/distributions/Magrathea-$RELEASE_VERSION-release-bundle.zip" \
            --repo "$GITHUB_REPOSITORY"

      - name: Plan a fresh or resumable publication
        id: remote
        env:
          GITHUB_SAIEN_MAVEN_USERNAME: ${{ github.actor }}
          GITHUB_SAIEN_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          COORDINATES="$RUNNER_TEMP/verified-candidate/distributions/Magrathea-$RELEASE_VERSION-maven-coordinates.txt"
          MANIFEST="$RUNNER_TEMP/verified-candidate/distributions/Magrathea-$RELEASE_VERSION-maven-files.sha256"
          MAVEN_REPOSITORY="$RUNNER_TEMP/verified-candidate/bundle/maven"
          PREFLIGHT_LOG="$RUNNER_TEMP/remote-preflight.log"
          set +e
          scripts/verify-remote-version-absent \
            "https://maven.pkg.github.com/sensefy/magrathea" \
            "saien.magrathea" \
            "$RELEASE_VERSION" \
            < "$COORDINATES" > "$PREFLIGHT_LOG" 2>&1
          status=$?
          set -e
          cat "$PREFLIGHT_LOG"
          if [[ "$status" -eq 0 ]]; then
            mode=fresh
          elif grep -Fq "immutable coordinate already exists" "$PREFLIGHT_LOG"; then
            scripts/resume-publish-sdk \
              --project-dir "$GITHUB_WORKSPACE" \
              --repository-url "https://maven.pkg.github.com/sensefy/magrathea" \
              --coordinates-file "$COORDINATES" \
              --local-maven-repository "$MAVEN_REPOSITORY" \
              --manifest-file "$MANIFEST" \
              --exact-files \
              --plan-only
            mode=resume
          else
            exit "$status"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Retain the promoted candidate for publication jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magrathea-${{ steps.release.outputs.version }}-promoted-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            candidate-download/Magrathea-${{ steps.release.outputs.version }}-release-candidate.zip
            candidate-download/Magrathea-${{ steps.release.outputs.version }}-release-candidate.zip.sha256

      - name: Summarize promotion
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          PUBLISH_MODE: ${{ steps.remote.outputs.mode }}
        run: |
          {
            echo "## Candidate promotion"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Candidate run: \`$CANDIDATE_RUN_ID\`"
            echo "- Publication mode: \`$PUBLISH_MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-maven:
    needs: promote-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: foundation
            modules: >-
              magrathea-core magrathea-provider-api magrathea-credentials
              magrathea-storage-web magrathea-gateway-server
          - name: runtime
            modules: >-
              magrathea-runtime magrathea-mcp magrathea-provider-openai
              magrathea-web-client
          - name: policy-protocol
            modules: >-
              magrathea-policy magrathea-gateway-protocol magrathea-provider-gemini
          - name: product
            modules: >-
              magrathea-provider-gateway magrathea-chatbot
              magrathea-provider-anthropic magrathea-storage-room
    name: publish-maven (${{ matrix.name }})
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download the promoted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: magrathea-${{ needs.promote-candidate.outputs.version }}-promoted-candidate
          path: promoted-candidate

      - name: Publish exact signed Maven files
        env:
          GITHUB_SAIEN_MAVEN_USERNAME: ${{ github.actor }}
          GITHUB_SAIEN_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.promote-candidate.outputs.version }}
          PUBLISH_MODE: ${{ needs.promote-candidate.outputs.publish_mode }}
          SHARD_MODULES: ${{ matrix.modules }}
          SHARD_NAME: ${{ matrix.name }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/promoted-candidate/Magrathea-$RELEASE_VERSION-release-candidate.zip"
          CHECKSUM="$CANDIDATE.sha256"
          (
            cd "$GITHUB_WORKSPACE/promoted-candidate"
            shasum -a 256 -c "$(basename "$CHECKSUM")"
          )
          EVIDENCE="$RUNNER_TEMP/candidate-evidence"
          STAGED="$RUNNER_TEMP/candidate-bundle"
          unzip -q "$CANDIDATE" -d "$EVIDENCE"
          unzip -q \
            "$EVIDENCE/distributions/Magrathea-$RELEASE_VERSION-release-bundle.zip" \
            "maven/*" \
            -d "$STAGED"
          read -r -a modules <<< "$SHARD_MODULES"
          COORDINATES="$RUNNER_TEMP/$SHARD_NAME-coordinates.txt"
          scripts/select-publishing-coordinates \
            "$EVIDENCE/distributions/Magrathea-$RELEASE_VERSION-maven-coordinates.txt" \
            "${modules[@]}" \
            > "$COORDINATES"
          publisher_args=(
            --project-dir "$GITHUB_WORKSPACE"
            --repository-url "https://maven.pkg.github.com/sensefy/magrathea"
            --coordinates-file "$COORDINATES"
            --local-maven-repository "$STAGED/maven"
            --manifest-file "$EVIDENCE/distributions/Magrathea-$RELEASE_VERSION-maven-files.sha256"
            --exact-files
          )
          if [[ "$PUBLISH_MODE" == fresh ]]; then
            publisher_args+=(--fresh)
          fi
          scripts/run-with-heartbeat \
            --label "maven-$SHARD_NAME" \
            --interval 300 \
            -- \
            scripts/resume-publish-sdk "${publisher_args[@]}"
          {
            echo "## Maven shard: $SHARD_NAME"
            echo
            echo "- Coordinates: \`$(wc -l < "$COORDINATES" | tr -d ' ')\`"
            echo "- Mode: \`$PUBLISH_MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [promote-candidate, publish-maven]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Download the promoted candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: magrathea-${{ needs.promote-candidate.outputs.version }}-promoted-candidate
          path: promoted-candidate

      - name: Extract release assets
        env:
          RELEASE_VERSION: ${{ needs.promote-candidate.outputs.version }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/promoted-candidate/Magrathea-$RELEASE_VERSION-release-candidate.zip"
          (
            cd "$GITHUB_WORKSPACE/promoted-candidate"
            shasum -a 256 -c "$(basename "$CANDIDATE").sha256"
          )
          mkdir release-assets
          unzip -q "$CANDIDATE" -d release-assets

      - name: Validate published Maven coordinates
        env:
          GITHUB_SAIEN_MAVEN_USERNAME: ${{ github.actor }}
          GITHUB_SAIEN_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.promote-candidate.outputs.version }}
        run: |
          scripts/verify-remote-version-present \
            "https://maven.pkg.github.com/sensefy/magrathea" \
            "saien.magrathea" \
            "$RELEASE_VERSION" \
            < "release-assets/distributions/Magrathea-$RELEASE_VERSION-maven-coordinates.txt"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Resolve the published SDK from an isolated consumer
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.promote-candidate.outputs.version }}
        run: |
          ./gradlew -p tooling/kmp-consumer \
            clean jvmTest compileAndroidMain \
            -Pmagrathea.repository=https://maven.pkg.github.com/sensefy/magrathea \
            -Pmagrathea.version="$RELEASE_VERSION" \
            -Pmagrathea.consumer.buildDir="$RUNNER_TEMP/magrathea-remote-consumer" \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.promote-candidate.outputs.version }}
        run: |
          BUNDLE="release-assets/distributions/Magrathea-$RELEASE_VERSION-release-bundle.zip"
          CHECKSUM="$BUNDLE.sha256"
          COORDINATES="release-assets/distributions/Magrathea-$RELEASE_VERSION-maven-coordinates.txt"
          MANIFEST="release-assets/distributions/Magrathea-$RELEASE_VERSION-maven-files.sha256"
          SBOM="release-assets/reports/supply-chain/magrathea-sbom.cdx.json"
          LICENSES="release-assets/reports/supply-chain/third-party-licenses.tsv"
          RECEIPT="release-assets/release/publish-verification.receipt"
          RELEASE_ASSETS=(
            "$BUNDLE"
            "$CHECKSUM"
            "$COORDINATES"
            "$MANIFEST"
            "$SBOM"
            "$LICENSES"
            "$RECEIPT"
          )
          IS_PRERELEASE=false
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING_ASSETS="$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name'
            )"
            MISSING_ASSETS=()
            mkdir -p "$RUNNER_TEMP/existing-release-assets"
            for asset in "${RELEASE_ASSETS[@]}"; do
              name="$(basename "$asset")"
              if grep -Fxq "$name" <<< "$EXISTING_ASSETS"; then
                gh release download "$GITHUB_REF_NAME" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$name" \
                  --dir "$RUNNER_TEMP/existing-release-assets"
                cmp "$asset" "$RUNNER_TEMP/existing-release-assets/$name"
              else
                MISSING_ASSETS+=("$asset")
              fi
            done
            if [[ "${#MISSING_ASSETS[@]}" -gt 0 ]]; then
              gh release upload "$GITHUB_REF_NAME" \
                "${MISSING_ASSETS[@]}" \
                --repo "$GITHUB_REPOSITORY"
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Magrathea $RELEASE_VERSION" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --prerelease="$IS_PRERELEASE"
          else
            RELEASE_FLAGS=()
            if [[ "$IS_PRERELEASE" == true ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" \
              "${RELEASE_ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Magrathea $RELEASE_VERSION" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              "${RELEASE_FLAGS[@]}"
          fi
